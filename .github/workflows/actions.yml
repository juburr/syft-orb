# Tests the GitHub Actions in actions/ on GitHub's own runners, as
# .circleci/test-deploy.yml tests the orb's commands on CircleCI. Each job
# runs the actions from this checkout (uses: ./actions/...), so a pull
# request tests its own changes.
name: GitHub Actions

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the offline tests
        run: |
          for test in tests/actions_test.sh tests/install_test.sh tests/env_subst_test.sh tests/generate_sbom_test.sh tests/log_sbom_test.sh tests/shell_conventions_test.sh; do
            echo "=== ${test}"
            bash "${test}"
          done

  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/install
      - name: Verify the install
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          version=$(grep -A3 '^  version:' src/commands/install.yml | sed -n 's/^    default: "\(.*\)"$/\1/p')
          [[ "$(command -v syft)" == "${HOME}/bin/syft" ]]
          syft version | tee "${RUNNER_TEMP}/version.log"
          grep -E "^Version:[[:space:]]+${version}$" "${RUNNER_TEMP}/version.log"
          grep -E "^Platform:[[:space:]]+${PLATFORM}$" "${RUNNER_TEMP}/version.log"
      # The first install saved the release to the cache, so this one
      # restores it. It goes to a directory of its own, which later steps
      # find first on the PATH.
      - uses: ./actions/install
        with:
          install_path: ${{ runner.temp }}/second
      - name: Verify the second install comes first on the PATH
        env:
          SECOND: ${{ runner.temp }}/second
        run: |
          [[ "$(command -v syft)" == "${SECOND}/syft" ]]
          syft version
      - name: Install an unlisted version, which must fail
        id: unlisted
        continue-on-error: true
        uses: ./actions/install
        with:
          version: 0.0.1
          caching: false
          install_path: ${{ runner.temp }}/unlisted
      - name: Verify it failed before installing anything
        env:
          OUTCOME: ${{ steps.unlisted.outcome }}
          UNLISTED: ${{ runner.temp }}/unlisted
        run: |
          [[ "${OUTCOME}" == failure ]]
          [[ ! -e "${UNLISTED}/syft" ]]

  # A fresh runner with the release's download hosts blocked installs from
  # the cache the install job saved, which only works if the cache is used.
  install-from-cache:
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Block the download hosts
        run: |
          echo "127.0.0.1 github.com objects.githubusercontent.com release-assets.githubusercontent.com" | sudo tee -a /etc/hosts
          if curl -sSf --max-time 10 -o /dev/null https://github.com; then
            echo "github.com is still reachable."
            exit 1
          fi
      - uses: ./actions/install
      - name: Verify the install
        run: |
          version=$(grep -A3 '^  version:' src/commands/install.yml | sed -n 's/^    default: "\(.*\)"$/\1/p')
          syft version | grep -E "^Version:[[:space:]]+${version}$"

  # test-deploy.yml's command-test and the core of test-scope-control: an
  # image in one and several formats, dir: and file: sources, an RPM (which
  # installs rpm2archive on the runner) and a DEB, exclusions, cataloger
  # selection, both logging modes, and an enrich value the script refuses.
  sbom:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/install
      - uses: ./actions/generate_sbom
        with:
          source: gcr.io/distroless/static:latest
      - name: Verify the image SBOM in the default directory
        run: jq -e '.spdxVersion == "SPDX-2.3"' sboms/static-latest.spdx.json
      - uses: ./actions/generate_sbom
        with:
          source: gcr.io/distroless/static:latest
          output_dir: multi-format-output/
          output_formats: spdx-json,cyclonedx-json,syft-json
      - name: Verify one scan wrote every format
        run: |
          jq -e '.spdxVersion == "SPDX-2.3"' multi-format-output/static-latest.spdx.json
          jq -e '.bomFormat == "CycloneDX"' multi-format-output/static-latest.cdx.json
          jq -e '.artifacts | type == "array"' multi-format-output/static-latest.syft.json
      - uses: ./actions/log_sbom
        with:
          sbom_dir: multi-format-output
      - uses: ./actions/generate_sbom
        with:
          source: dir:.
          output_dir: scheme-names
          enrich: none
      - uses: ./actions/generate_sbom
        with:
          source: file:README.md
          output_dir: scheme-names
          enrich: none
      - name: "Verify dir: and file: sources produce clean filenames"
        run: |
          ls -la scheme-names/
          test -f "scheme-names/$(basename "${PWD}").spdx.json"
          test -f scheme-names/README.md.spdx.json
      - name: Download an RPM and build a DEB to scan
        run: |
          mkdir -p "${RUNNER_TEMP}/rpm"
          curl -fsSL --proto '=https' -o "${RUNNER_TEMP}/rpm/syft_1.24.0_linux_amd64.rpm" \
            https://github.com/anchore/syft/releases/download/v1.24.0/syft_1.24.0_linux_amd64.rpm
          root="${RUNNER_TEMP}/debroot"
          mkdir -p "${root}/DEBIAN" "${root}/opt/demo"
          printf 'Package: debdemo\nVersion: 1.0.0\nArchitecture: all\nMaintainer: test <test@example.com>\nDescription: test\n' > "${root}/DEBIAN/control"
          printf 'version = 3\n\n[[package]]\nname = "deb-crate"\nversion = "1.0.0"\nsource = "registry+https://github.com/rust-lang/crates.io-index"\n' > "${root}/opt/demo/Cargo.lock"
          dpkg-deb --build "${root}" "${RUNNER_TEMP}/debdemo_1.0.0_all.deb"
      - uses: ./actions/generate_sbom
        with:
          source: ${{ runner.temp }}/rpm/syft*_linux_amd64.rpm
          output_dir: rpm-sboms
          output_formats: spdx-json,cyclonedx-json
      - uses: ./actions/generate_sbom
        with:
          source: ${{ runner.temp }}/debdemo_1.0.0_all.deb
          output_dir: deb-sboms
          output_formats: syft-json
          enrich: none
      - name: Verify the RPM and DEB SBOMs
        run: |
          command -v rpm2archive
          jq -e '.spdxVersion == "SPDX-2.3"' rpm-sboms/syft_1.24.0_linux_amd64.spdx.json
          jq -e '.bomFormat == "CycloneDX"' rpm-sboms/syft_1.24.0_linux_amd64.cdx.json
          jq -e 'any(.artifacts[]; .name == "deb-crate")' deb-sboms/debdemo_1.0.0_all.syft.json
      - name: Create a fixture with lockfiles to exclude
        run: |
          m="${RUNNER_TEMP}/mono"
          mkdir -p "${m}/web" "${m}/target/package"
          cargo_lock() {
            printf 'version = 3\n\n[[package]]\nname = "%s"\nversion = "%s"\nsource = "registry+https://github.com/rust-lang/crates.io-index"\n' "$1" "$2"
          }
          cargo_lock itoa 1.0.11 > "${m}/Cargo.lock"
          cargo_lock target-only-crate 0.0.1 > "${m}/target/package/Cargo.lock"
          printf '{"name":"web","version":"1.0.0","lockfileVersion":3,"packages":{"":{"name":"web","version":"1.0.0"},"node_modules/lodash":{"version":"4.17.21"}}}\n' > "${m}/web/package-lock.json"
      - uses: ./actions/generate_sbom
        with:
          source: dir:${{ runner.temp }}/mono
          output_dir: scope
          output_formats: syft-json
          enrich: none
          exclude: |
            ./target/**
          select_catalogers: "-javascript-lock-cataloger"
      - name: Verify exclude and select_catalogers
        run: |
          jq -r '.artifacts[].name' scope/mono.syft.json | tee scope-names.txt
          grep -qx itoa scope-names.txt
          if grep -qxE 'target-only-crate|lodash' scope-names.txt; then
            echo "An excluded package is in the SBOM."
            exit 1
          fi
      - uses: ./actions/log_sbom
        with:
          pretty: false
          sbom_file: rpm-sboms/*.json deb-sboms/missing.syft.json
      - name: Generate with an unknown enrich value, which must fail
        id: bad-enrich
        continue-on-error: true
        uses: ./actions/generate_sbom
        with:
          source: dir:.
          output_dir: bad-enrich
          enrich: everything
      - name: Verify the unknown enrich value failed before scanning
        env:
          OUTCOME: ${{ steps.bad-enrich.outcome }}
        run: |
          [[ "${OUTCOME}" == failure ]]
          [[ ! -e bad-enrich ]]

  # The arm64 build on an Arm runner, as test-deploy.yml's
  # test-sbom-container-arm64 does with the generate_sbom job.
  sbom-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/install
      - uses: ./actions/generate_sbom
        with:
          source: gcr.io/distroless/static:latest
          output_dir: sboms-arm64
          output_formats: cyclonedx-json,spdx-json
          scope: all-layers
      - name: Verify the arm64 SBOMs
        run: |
          [[ "$(uname -m)" == aarch64 ]]
          jq -e '.bomFormat == "CycloneDX"' sboms-arm64/static-latest.cdx.json
          jq -e '.spdxVersion == "SPDX-2.3"' sboms-arm64/static-latest.spdx.json
      - uses: ./actions/log_sbom
        with:
          sbom_file: sboms-arm64/*.cdx.json
