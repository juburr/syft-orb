version: 2.1
setup: true
orbs:
  orb-tools: circleci/orb-tools@12.5
  shellcheck: circleci/shellcheck@3.4

filters: &filters
  tags:
    only: /.*/

jobs:
  test-install:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Run install contract tests
          command: bash tests/install_test.sh
  test-env-subst:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Run circleci env subst tests
          command: bash tests/env_subst_test.sh
  test-generate-sbom:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Run generate_sbom script tests
          command: bash tests/generate_sbom_test.sh
  test-shell-conventions:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Run shell conventions tests
          command: bash tests/shell_conventions_test.sh

workflows:
  lint-pack:
    jobs:
      - test-install:
          filters: *filters
      - test-env-subst:
          filters: *filters
      - test-generate-sbom:
          filters: *filters
      - test-shell-conventions:
          filters: *filters
      - orb-tools/lint:
          filters: *filters
      - orb-tools/pack:
          filters: *filters
      - orb-tools/review:
          filters: *filters
      - shellcheck/check:
          filters: *filters
      # Triggers the next workflow in the Orb Development Kit.
      - orb-tools/continue:
          pipeline_number: << pipeline.number >>
          vcs_type: << pipeline.project.type >>
          orb_name: syft-orb
          requires: [test-install, test-env-subst, test-generate-sbom, test-shell-conventions, orb-tools/lint, orb-tools/pack, orb-tools/review, shellcheck/check]
          filters: *filters
