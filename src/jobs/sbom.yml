description: |
  Generate Software Bill of Materials (SBOM) for any source: package files
  (RPM, DEB), container images, directories, or source code. Generates multiple
  formats simultaneously in a single scan and integrates with CircleCI workspaces.

  Output filenames are auto-generated from the source basename with
  format-appropriate suffixes (e.g., myapp-1.2.3-1.el9.x86_64.spdx.json).

  For source code scanning, use "dir:." to scan the current directory.
  This captures dependencies from package.json, go.mod, requirements.txt,
  etc. that may not be present in compiled/transpiled artifacts.

parameters:
  # Source Configuration
  source:
    type: string
    description: |
      Package file path, container image, or directory to scan.
      Wildcards supported for RPM/DEB files.
      Examples:
        - "./rpms/myapp*.el9.x86_64.rpm"
        - "./rpms/myapp*.noarch.rpm"
        - "./debs/myapp_*_amd64.deb"
        - "ghcr.io/org/app:1.0.0"
        - "dir:."

  # Output Configuration
  output_dir:
    type: string
    default: "sboms"
    description: Directory for generated SBOM files.

  output_formats:
    type: string
    default: "cyclonedx-json,spdx-json"
    description: |
      Comma-separated list of output formats to generate. Syft scans once and generates all formats simultaneously.
      Examples: "spdx-json" (single), "spdx-json,cyclonedx-json" (multiple)
      Supported formats: cyclonedx-json, cyclonedx-xml, github-json, purls, spdx-json, spdx-tag-value, syft-json, syft-table, syft-text, template

  # Syft Configuration
  syft_version:
    type: string
    default: "1.52.0"
    description: Syft version to install.

  verify_checksums:
    type: enum
    default: strict
    enum: ["false", "known_versions", "strict"]
    description: |
      SHA-512 checksum verification of the downloaded Syft executable. "strict" fails if syft_version has
      no checksum known to this orb; "known_versions" and "false" are explicit opt-outs.

  scope:
    type: enum
    default: squashed
    enum: ["squashed", "all-layers", "deep-squashed"]
    description: Layer selection for container image scanning.

  enrich:
    type: enum
    default: all
    enum: ["none", "all", "golang", "java", "javascript", "python", "vcpkg"]
    description: Package data enrichment from local and online sources.

  base_path:
    type: string
    default: ""
    description: Override the default base path for SBOM generation.

  exclude:
    type: string
    default: ""
    description: |
      Comma- or newline-separated glob patterns to exclude, each passed to syft as --exclude.
      For dir: sources, patterns are relative to the scan root and must start with "./", "*/" or "**/",
      e.g. "./target/**,**/node_modules/**". See the generate_sbom command for details.

  config:
    type: string
    default: ""
    description: Path to a syft configuration file, passed as --config.

  select_catalogers:
    type: string
    default: ""
    description: |
      Passed to syft --select-catalogers: "+name" adds, "-name"/"-tag" removes, and an unprefixed tag keeps only
      default catalogers with that tag, e.g. "-file" or "+sbom-cataloger". See the generate_sbom command.

  # Workspace Configuration
  attach_workspace:
    type: boolean
    default: true
    description: Attach workspace before scanning (for accessing build artifacts).

  workspace_root:
    type: string
    default: "."
    description: Directory to attach workspace to.

  persist_to_workspace:
    type: boolean
    default: true
    description: Persist output directory to workspace after generation.

  # Logging Configuration
  log_sboms:
    type: boolean
    default: true
    description: Pretty-print generated SBOMs to job output.

  # Executor Configuration
  cimg_tag:
    type: string
    default: "current-22.04"
    description: Tag for cimg/base Docker image.

  resource_class:
    type: enum
    default: medium
    enum: ["small", "medium", "medium+", "large", "xlarge", "2xlarge", "2xlarge+", "arm.medium", "arm.large", "arm.xlarge", "arm.2xlarge"]
    description: CircleCI resource class for the job. Use an arm.* class to run on arm64.

docker:
  - image: cimg/base:<< parameters.cimg_tag >>

resource_class: << parameters.resource_class >>

steps:
  # Attach workspace if requested
  - when:
      condition: << parameters.attach_workspace >>
      steps:
        - attach_workspace:
            at: << parameters.workspace_root >>

  # Install Syft
  - install:
      caching: true
      version: << parameters.syft_version >>
      verify_checksums: << parameters.verify_checksums >>

  # Generate SBOMs in all requested formats (single scan)
  - generate_sbom:
      source: << parameters.source >>
      output_dir: << parameters.output_dir >>/
      output_formats: << parameters.output_formats >>
      scope: << parameters.scope >>
      enrich: << parameters.enrich >>
      base_path: << parameters.base_path >>
      exclude: << parameters.exclude >>
      config: << parameters.config >>
      select_catalogers: << parameters.select_catalogers >>

  # Log SBOMs if requested
  - when:
      condition: << parameters.log_sboms >>
      steps:
        - log_sbom:
            sbom_dir: << parameters.output_dir >>
            pretty: true

  # Persist to workspace if requested
  - when:
      condition: << parameters.persist_to_workspace >>
      steps:
        - persist_to_workspace:
            root: .
            paths:
              - << parameters.output_dir >>
