description: Generates Software Bill of Materials (SBOM) in one or more formats simultaneously
parameters:
  base_path:
    type: string
    default: ""
    description: Override the default base path for SBOM generation. The orb automatically sets this if left blank.
  config:
    type: string
    default: ""
    description: |
      Path to a syft configuration file, passed as --config. Relative paths are resolved against the working directory.
      Non-empty exclude and select_catalogers parameters replace the same keys in the file. Note that syft also loads
      .syft.yaml from the working directory on its own when no config is given. RPM and DEB sources are scanned from
      a temporary extraction directory, so use absolute paths for path-valued settings inside the file
      (e.g. format.template.path) when scanning packages.
  exclude:
    type: string
    default: ""
    description: |
      Comma- or newline-separated glob patterns to exclude from the scan, each passed to syft as --exclude.
      For dir: and file: sources and extracted RPM/DEB packages, patterns are relative to the scan root and must
      start with "./", "*/" or "**/", e.g. "./target/**,**/node_modules/**". For container images, patterns match
      absolute paths inside the image, e.g. "/usr/share/doc/**". Commas inside {a,b} alternations are preserved.
  enrich:
    type: enum
    default: all
    description: Enable package data enrichment from local and online sources,
      to include additional metadata such as licenses, URLs, and more.
    enum: ["none", "all", "golang", "java", "javascript", "python", "vcpkg"]
  source:
    type: string
    description: The container image URI, RPM filename, DEB filename, or filesystem directory to scan.
  output_dir:
    type: string
    default: ""
    description: |
      Output directory path for the SBOM files. Supports two modes:
        - Empty (default): Auto-generates filenames in sboms/ directory (e.g., sboms/myapp-1.0.0.spdx.json)
        - Specified path: Auto-generates filenames in the specified directory (e.g., "custom/" → custom/myapp-1.0.0.spdx.json)
      The auto-generated filename is derived from the source (package name for RPM/DEB, image name for containers, directory name for paths) with a format-appropriate suffix.
  output_formats:
    type: string
    default: spdx-json
    description: |
      Comma-separated list of output formats to generate. Syft scans once and generates all formats simultaneously.
      Examples: "spdx-json" (single), "spdx-json,cyclonedx-json" (multiple)
      Supported formats: cyclonedx-json, cyclonedx-xml, github-json, purls, spdx-json, spdx-tag-value, syft-json, syft-table, syft-text, template
  scope:
    type: enum
    default: squashed
    description: Selection of layers to catalog.
    enum: ["squashed", "all-layers", "deep-squashed"]
  select_catalogers:
    type: string
    default: ""
    description: |
      Passed to syft --select-catalogers, adjusting the default cataloger set for the source type. Comma-separated:
      "+name" adds a cataloger, "-name" or "-tag" removes catalogers, and an unprefixed tag (e.g. "rust") keeps only
      the default catalogers with that tag. Unprefixed cataloger names are rejected by syft. To replace the default
      set itself, use default-catalogers in a config file. See "syft cataloger list" for names and tags.
steps:
  - run:
      name: Generate SBOM
      environment:
        PARAM_BASE_PATH: << parameters.base_path >>
        PARAM_CONFIG: << parameters.config >>
        PARAM_ENRICH: << parameters.enrich >>
        PARAM_EXCLUDE: << parameters.exclude >>
        PARAM_SOURCE: << parameters.source >>
        PARAM_OUTPUT_DIR: << parameters.output_dir >>
        PARAM_OUTPUT_FORMATS: << parameters.output_formats >>
        PARAM_SCOPE: << parameters.scope >>
        PARAM_SELECT_CATALOGERS: << parameters.select_catalogers >>
      shell: /bin/bash
      command: << include(scripts/generate_sbom.sh) >>
