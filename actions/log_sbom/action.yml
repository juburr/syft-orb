name: Log SBOM contents
description: >
  Prints generated SBOMs to the step log for logging or debugging. Each file's
  format is detected from its name: files ending in .json are treated as JSON,
  pretty-printed (with pretty) and cut off after 100 lines, and other files
  are printed in full. The GitHub Actions twin of the orb's log_sbom command.
author: juburr

inputs:
  pretty:
    description: Pretty print JSON-based SBOMs (files ending in .json) using jq.
    default: "true"
  sbom_dir:
    description: >
      Directory containing SBOM files to log. When provided, logs every file
      in the directory with an SBOM suffix written by generate_sbom
      (.spdx.json, .cdx.json, .syft.json, .github.json, .cdx.xml, .spdx,
      .syft.txt, .purls.txt); template output (.txt) is not picked up. Set
      either sbom_dir or sbom_file; when both are set, sbom_dir is used and
      sbom_file is ignored.
    default: ""
  sbom_file:
    description: >
      Path of the SBOM file to log. Several files can be listed, separated by
      spaces, and each entry may be a shell glob such as "sboms/*.spdx.json",
      so a path cannot itself contain spaces. A file that does not exist is
      reported with a warning. Ignored when sbom_dir is set.
    default: ""

runs:
  using: composite
  steps:
    - name: Log SBOM Contents
      shell: bash
      env:
        PARAM_PRETTY: ${{ inputs.pretty }}
        PARAM_SBOM_DIR: ${{ inputs.sbom_dir }}
        PARAM_SBOM_FILE: ${{ inputs.sbom_file }}
      run: bash "${GITHUB_ACTION_PATH}/../run_script.sh" "${GITHUB_ACTION_PATH}/../../src/scripts/log_sbom.sh"
